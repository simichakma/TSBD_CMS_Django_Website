<!-- Contact Section - Featured CTA Style -->
<section class="contact-section">
  <div class="container">
    <h2>Ready to Work With Us?</h2>
    <p>Let's discuss your project and how we can help transform your vision into reality.</p>
    
    <div class="contact-buttons">
      <a href="{% url 'contact' %}" class="contact-btn contact-btn-primary">
        Send us a Message
      </a>
      <a href="tel:+8801234567890" class="contact-btn contact-btn-secondary">
        📞 Call Us Today
      </a>
    </div>
  </div>
  
  <!-- Optional: Contact Form -->
  <div class="container" style="margin-top: 60px;">
    <div class="contact-form">
      <h3 style="text-align: center; color: var(--dark); margin-bottom: 32px; font-size: 24px;">Get in Touch</h3>
      
      <form method="POST" action="{% url 'contact' %}">
        {% csrf_token %}
        
        <div style="display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+880 1234 567890">
        </div>
        
        <div class="form-group">
          <label for="company">Company Name</label>
          <input type="text" id="company" name="company" placeholder="Your company">
        </div>
        
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            <option value="project-inquiry">Project Inquiry</option>
            <option value="partnership">Partnership Opportunity</option>
            <option value="training">Training Program</option>
            <option value="support">Technical Support</option>
            <option value="other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us about your project or inquiry..." required></textarea>
        </div>
        
        <button type="submit" class="form-submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
