{% extends "dashboard/base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold">
                {% if product %}
                    Edit Product
                {% else %}
                    Add Product
                {% endif %}
            </h3>

            <p class="text-muted">
                Manage your products
            </p>
        </div>

        <a href="{% url 'product-list' %}"
           class="btn btn-secondary">
            Back
        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data" id="productForm">

                {% csrf_token %}


                <!-- Product Name -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="product_name"
                        id="product_name"
                        class="form-control"
                        placeholder="Enter product name"
                        value="{% if product %}{{ product.1 }}{% endif %}"
                        required
                    >

                </div>


                <!-- Product Details -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Product Details
                    </label>

                    <textarea
                        name="product_details"
                        id="product_details"
                        class="form-control"
                        rows="5"
                        placeholder="Enter product details"
                    >{% if product %}{{ product.2 }}{% endif %}</textarea>

                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Product Image</label>
                    {% if product_image_url %}
                        <div class="mb-2"><img src="{{ product_image_url }}" width="140" height="90" class="rounded border" style="object-fit:cover" alt="Current product image"></div>
                    {% endif %}
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <!-- Status -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Status
                    </label>

                    <select
                        name="status"
                        id="status"
                        class="form-select"
                    >

                        <option
                            value="1"
                            {% if product and product.3 == 1 %}
                                selected
                            {% elif not product %}
                                selected
                            {% endif %}
                        >
                            Active
                        </option>

                        <option
                            value="0"
                            {% if product and product.3 == 0 %}
                                selected
                            {% endif %}
                        >
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        {% if product %}
                            Update Product
                        {% else %}
                            Save Product
                        {% endif %}
                    </button>

                    <a
                        href="{% url 'product-list' %}"
                        class="btn btn-light"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="{% static "js/products/products.js" %}"></script>

{% endblock %}
